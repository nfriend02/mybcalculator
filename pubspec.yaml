name: mybcalculator
description: "AI Smart Calculator — MyBranch portfolio branch app (Flutter + Firebase + Netlify)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0
  flutter_dotenv: ^6.0.1
  go_router: ^18.0.1
  provider: ^6.1.5+1
  intl: ^0.20.3
  speech_to_text: ^7.5.0
  http: ^1.6.0
  uuid: ^4.6.0
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2
  file_picker: ^13.1.0
  archive: ^4.3.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/config/
    - assets/images/
    - assets/icons/
