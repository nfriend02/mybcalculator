[build]
  command = "bash netlify/build.sh"
  publish = "build/web"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Flutter is installed in netlify/build.sh

# API → Netlify Functions (must win over SPA fallback)
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# SPA fallback for Flutter web routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers (lightweight)
# Allow embedding in HS Warehouse iframe (no X-Frame-Options DENY).
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self' https://hswarehouse.netlify.app https://*.netlify.app"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
